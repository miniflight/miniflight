<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miniflight pitwall</title>
<script src="https://cdn.plot.ly/plotly-3.6.0.min.js"></script>
<style>
  :root { color-scheme:dark; font:13px system-ui; background:#000; color:#e8edf4; }
  body { max-width:1280px; margin:auto; padding:16px; }
  h1 { margin:0 0 4px; font-size:20px; font-weight:600; }
  p, footer { color:#9caabd; line-height:1.4; margin:4px 0; }
  #summary, main, #diagnostics { display:grid; gap:8px; margin:12px 0; }
  #summary { grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); }
  main, #diagnostics { grid-template-columns:repeat(2,minmax(0,1fr)); }
  article, .chart { background:#000; border:1px solid #202020; border-radius:2px; }
  article { padding:10px; } article small { display:block; color:#9caabd; margin-bottom:4px; }
  article strong { font-size:20px; font-variant-numeric:tabular-nums; }
  .chart { height:250px; overflow:hidden; }
  #camera { width:100%; height:calc(100% - 26px); object-fit:contain; } .camera small { display:block; padding:8px 12px 0; }
  @media(max-width:780px) { body { padding:16px; } main, #diagnostics { grid-template-columns:1fr; } }
</style>
<header><h1>Miniflight pitwall</h1><p><span id="source">Waiting for recorded signals</span><br><small id="feed"></small><br><span id="note"></span></p></header>
<section id="summary" aria-label="Flight summary"></section>
<main aria-label="Performance charts"><div class="chart camera"><small id="camera-title">Camera</small><img id="camera" src="./camera.mjpg" alt="AI-GP camera feed"></div></main>
<details><summary>Sensor and rate diagnostics</summary><section id="diagnostics"></section></details>
<footer>Flight plots use the controller reference clock. Native finish uses the game clock.<br>Motor requests and reported outputs are fractions. Missing channels stay blank. Drag to zoom; double-click to reset.</footer>
<script>
const colors = ['#64dac3', '#ffb66b', '#b6a1ff', '#ff7898'];
document.querySelector('details').addEventListener('toggle', () => document.querySelectorAll('#diagnostics .chart').forEach(div => Plotly.Plots.resize(div)));
async function refresh() {
  try {
    const response = await fetch('./latest.json', {cache:'no-store'});
    if (!response.ok) throw new Error(`Snapshot HTTP ${response.status}`);
    const data = await response.json();
    document.querySelector('#source').textContent = data.title;
    document.querySelector('#note').textContent = data.note || (data.summary.Commands === 0 ? 'Waiting for control samples · plots hold the last flight' : '');
    const age = data.published_at === undefined ? null : Math.max(0, Date.now()/1000-data.published_at);
    document.querySelector('#camera-title').textContent = data.flight_active && (age === null || age < 3) ? 'Camera · UDP 5600' : 'Camera · last frame';
    document.querySelector('#feed').textContent = age === null ? 'Recorded snapshot' :
      `${data.completed ? 'Flight completed' : 'Recorded signals'} · observer ${age < 3 ? 'updating' : 'stopped'} · snapshot ${age.toFixed(1)} s ago`;
    const summary = document.querySelector('#summary');
    summary.replaceChildren(...Object.entries(data.summary).map(([label, value]) => {
      const card = document.createElement('article'), name = document.createElement('small'), number = document.createElement('strong');
      name.textContent = label; number.textContent = value; card.append(name, number); return card;
    }));
    for (const [index, chart] of data.charts.entries()) {
      if (chart.detail && !document.querySelector('details').open || !chart.series.some(series => series.x.length)) continue;
      const id = `chart-${index}`;
      let div = document.getElementById(id);
      if (!div) { div = document.createElement('div'); div.id = id; div.className = 'chart'; document.querySelector(chart.detail ? '#diagnostics' : 'main').append(div); }
      const traces = chart.series.map((series, i) => ({x:series.x, y:series.y, name:series.label, mode:chart.mode || 'lines', line:{color:colors[i % colors.length], width:1.6}}));
      const source = chart.x_label === 'Trial' ? `trials:${traces[0].x.at(-1)}` : data.source;
      if (div.dataset.source === source) {
        const count = div.data[0].x.length;
        if (traces[0].x.length > count) await Plotly.extendTraces(div,
          {x:traces.map(trace => trace.x.slice(count)), y:traces.map(trace => trace.y.slice(count))}, traces.map((_, i) => i));
        continue;
      }
      await Plotly.react(div, traces, {
        title:{text:chart.title, font:{size:12}}, margin:{l:44,r:12,t:56,b:38},
        paper_bgcolor:'#000', plot_bgcolor:'#000', font:{color:'#c8d3e2',size:11},
        xaxis:{title:{text:chart.x_label || 'Reference time (s)'},gridcolor:'#293344'}, yaxis:{title:{text:chart.unit},gridcolor:'#293344',zerolinecolor:'#42516a'},
        legend:{orientation:'h',font:{size:10},y:1.02,yanchor:'bottom',x:1,xanchor:'right'}, hovermode:'x unified', uirevision:data.source
      }, {responsive:true,displaylogo:false});
      div.dataset.source = source;
    }
  } catch (error) { document.querySelector('#source').textContent = `Waiting for a snapshot: ${error.message}`; }
  setTimeout(refresh, 1000);
}
refresh();
</script>
</html>
