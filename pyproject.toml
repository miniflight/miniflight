# pyproject.toml
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miniflight"
version = "0.1.0"
description = "Companion-computer flight stack"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib",
    "hidapi",
    "gymnasium",
]

[project.optional-dependencies]
aigp = [
    "pymavlink==2.4.49",
    "opencv-python-headless>=4.8",
]
test = [
    "pytest>=7.0",
    "scipy>=1.10 ; extra == 'test'",
]

[tool.setuptools.packages.find]
include = ["miniflight*", "common*", "target*"]
namespaces = false
