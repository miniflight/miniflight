# pyproject.toml
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miniflight"
version = "0.1.0"
description = "Python flight control routines and vehicle interfaces"
requires-python = ">=3.11.4"
dependencies = []

[project.optional-dependencies]
aigp = [
    "numpy>=1.24",
    "pymavlink==2.4.49",
    "opencv-python-headless>=4.8",
]
examples = [
    "numpy>=1.24",
    "matplotlib",
    "hidapi",
    "gymnasium",
]
[tool.setuptools.packages.find]
include = ["miniflight*", "common*", "target*"]
namespaces = false
