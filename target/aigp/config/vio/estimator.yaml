init_dyn_bias_a: [ 0.0, 0.0, 0.0 ]
record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"
use_klt: true
num_pts: 80
fast_threshold: 20
grid_x: 5
grid_y: 5
min_px_dist: 10
knn_ratio: 0.70
track_frequency: 30.0
downsample_cameras: false
num_opencv_threads: 1
histogram_method: "HISTOGRAM"
use_aruco: false
num_aruco: 1024
downsize_aruco: true
up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
